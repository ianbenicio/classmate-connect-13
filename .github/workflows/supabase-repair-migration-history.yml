name: Supabase repair migration history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-repair-migration-history.yml"
  workflow_dispatch: {}

jobs:
  repair:
    name: repair remote-only migration history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltam secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF e SUPABASE_DB_PASSWORD precisam estar configurados."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Mark remote-only migration versions as reverted
        run: |
          supabase migration repair --linked --password "$SUPABASE_DB_PASSWORD" --status reverted \
            20260516232726 \
            20260516232811 \
            20260518173456 \
            20260518181226 \
            20260518223601 \
            20260518225417 \
            20260519032335 \
            20260519035312 \
            20260521105922 \
            20260521112138 \
            20260521133724

      - name: Mark superseded local dump migration as applied
        run: supabase migration repair --linked --password "$SUPABASE_DB_PASSWORD" --status applied 20260503125106

      - name: Push migrations
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
